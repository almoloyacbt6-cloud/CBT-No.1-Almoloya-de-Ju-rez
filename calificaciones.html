<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAE | Sistema de Calificaciones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --verde-cbt: #004d40;
            --verde-claro: #00796b;
            --dorado: #b8860b;
            --gris-fondo: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--gris-fondo); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* Estilo Tarjeta Login */
        .login-card { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border-top: 6px solid var(--verde-cbt); }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        .btn-principal { background: var(--verde-cbt); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-bottom: 10px; }
        .btn-principal:hover { background: var(--verde-claro); }

        .btn-regresar-enlace {
        background: #555;
        color: rgb(255, 255, 255) !important;
        text-decoration: none; /* Quita el subrayado del link */
        padding: 12px;
        width: 100%;
        border-radius: 6px;
        display: block; /* Hace que se comporte como un bloque */
        font-weight: bold;
        margin-top: 10px;
        box-sizing: border-box; /* Para que el padding no lo ensanche de más */
        transition: 0.3s;
    }

    .btn-regresar-enlace:hover {
        background: #333;
    }
        /* Estilo Panel de Calificaciones */
        .panel-calificaciones { display: none; width: 90%; max-width: 1000px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .panel-header { background: var(--verde-cbt); color: white; padding: 25px 35px; display: flex; justify-content: space-between; align-items: center; }
        .badge-grado { background: var(--dorado); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-left: 10px; }

        .tabs-menu { display: flex; background: #e8eceb; padding: 10px 10px 0 10px; gap: 5px; }
        .tab-btn { padding: 15px 25px; border: none; background: #d1d8d7; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; color: #555; transition: 0.3s; }
        .tab-btn.active { background: white; color: var(--verde-cbt); border-bottom: 3px solid var(--verde-cbt); }

        .tab-content { display: none; padding: 30px; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 15px; text-align: left; border: 1px solid #eee; }
        th { background: #f9f9f9; color: var(--verde-cbt); text-transform: uppercase; font-size: 12px; }
        .nota { font-weight: bold; color: var(--verde-claro); text-align: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* --- INICIO DEL FONDO ANIMADO --- */

@keyframes ani-body {
    0% {
        --x-0: 91%; --s-start-0: 1%; --s-end-0: 61%; --c-0: hsla(124, 0%, 0%, 1); --y-0: 90%;

        --x-4: 74%; --y-4: 93%; --c-4: hsla(349, 0%, 0%, 1); --s-start-4: 12%; --s-end-4: 82%;
        --x-5: 94%; --c-5: hsla(349, 0%, 0%, 1); --s-start-5: 12%; --s-end-5: 82%; --y-5: 38%;
    }
    100% {
        --x-0: 15%; --s-start-0: 4.68%; --s-end-0: 94.34%; --c-0: hsla(124, 33%, 55%, 1); --y-0: 8%;
        --x-1: 79%; --y-1: 36%; --c-1: hsla(124, 0%, 0%, 1); --s-start-1: 4.68%; --s-end-1: 77%;

}

body {
    --x-0: 91%; --c-0: hsla(124, 0%, 0%, 1); --y-0: 90%;
    --x-1: 2%; --y-1: 101%; --c-1: hsla(75, 0%, 0%, 1);

    // 2. FUNCIÓN DE VALIDACIÓN (Llamada por el botón)
    function validar() {
        console.log("Boton presionado..."); // Esto saldrá en la consola si el botón sirve

        // Capturar valores
        var cInput = document.getElementById("curp").value.trim().toUpperCase();
        var mInput = document.getElementById("matricula").value.trim().toUpperCase();

        if (cInput === "" || mInput === "") {
            alert("Por favor completa ambos campos");
            return;
        }

        // UNIR LISTAS (Forma antigua para evitar errores de sintaxis)
        var todos = alumnos1ro.concat(alumnos2do, alumnos3ro);
        var encontrado = null;

        // BUSCAR ALUMNO
        for (var i = 0; i < todos.length; i++) {
            var a = todos[i];
            // Revisamos nombres de columnas (curp, Curp, matricula, Matricula )
            var cLista = (a.curp || a.Curp || "").toString().trim().toUpperCase();
            var mLista = (a.matricula || a.Matricula || a["Matricula "] || "").toString().trim().toUpperCase();

            if (cLista === cInput && mLista === mInput) {
                encontrado = a;
                break;
            }
        }

        if (encontrado) {
            // MOSTRAR PANEL Y OCULTAR LOGIN
            document.getElementById("area-login").style.display = "none";
            document.getElementById("area-panel").style.display = "block";
            
            // PONER NOMBRE Y GRADO
            document.getElementById("txt-nombre").innerText = encontrado.nombre;
            document.getElementById("txt-grado").innerText = encontrado.grado;
            
            // DIBUJAR TABLAS (Verificamos que existan los parciales)
            var p1 = (encontrado.parciales && encontrado.parciales.p1) ? encontrado.parciales.p1 : [];
            var p2 = (encontrado.parciales && encontrado.parciales.p2) ? encontrado.parciales.p2 : [];
            var p3 = (encontrado.parciales && encontrado.parciales.p3) ? encontrado.parciales.p3 : [];

            renderTabla("tabla-p1", p1);
            renderTabla("tabla-p2", p2);
            renderTabla("tabla-p3", p3);
        } else {
            alert("Alumno no encontrado. Revisa que tu CURP y Matrícula coincidan con la lista.");
        }
    }

    // 3. DIBUJAR TABLAS HTML
    function renderTabla(id, datos) {
        var contenedor = document.getElementById(id);
        if (datos.length === 0) {
            contenedor.innerHTML = "<p style='color:gray; padding:10px;'>Sin calificaciones registradas.</p>";
            return;
        }
        var html = "<table><thead><tr><th>Materia</th><th>Calif.</th></tr></thead><tbody>";
        for (var j = 0; j < datos.length; j++) {
            html += "<tr><td>" + datos[j].m + "</td><td class='nota'>" + datos[j].c.toFixed(1) + "</td></tr>";
        }
        html += "</tbody></table>";
        contenedor.innerHTML = html;
    }
    

    // 4. CAMBIO DE PESTAÑAS (TABS)
    function cambiarParcial(evt, parcialId) {
        var contenidos = document.getElementsByClassName('tab-content');
        for (var k = 0; k < contenidos.length; k++) { 
            contenidos[k].classList.remove('active'); 
        }
        
        var botones = document.getElementsByClassName('tab-btn');
        for (var l = 0; l < botones.length; l++) { 
            botones[l].classList.remove('active'); 
        }
        
        document.getElementById(parcialId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }
    // Esta función ahora es "a prueba de errores"
    function irAWebPrincipal() {
        // Esto limpia la URL y recarga la página actual, regresándote al login
        window.location.href = window.location.pathname;
    }
